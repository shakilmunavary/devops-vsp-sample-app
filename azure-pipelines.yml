# Azure DevOps CI/CD Pipeline for Spring Boot Sample App
trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

steps:
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  displayName: 'Setup Java JDK 17'

- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean package'
    options: '-DskipTests'
    publishJUnitResults: false
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.17'
  displayName: 'Build Spring Boot JAR'

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(System.DefaultWorkingDirectory)/target'
    Contents: '*.jar'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
  displayName: 'Stage Build Artifacts'

- task: AzureWebApp@1
  inputs:
    azureSubscription: 'azure-sp-connection'
    appType: 'webAppLinux'
    appName: 'devops-vsp-sample-app-shakil'
    package: '$(Build.ArtifactStagingDirectory)/*.jar'
  displayName: 'Deploy to Azure App Service'
