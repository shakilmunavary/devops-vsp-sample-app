<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Boot User Portal (H2 In-Memory DB)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .form-control { background-color: #0f172a; border: 1px solid #475569; color: #f8fafc; }
        .form-control:focus { background-color: #0f172a; border-color: #38bdf8; color: #fff; box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25); }
        .table-dark { background-color: #1e293b; border-color: #334155; }
        .badge-h2 { background-color: #0284c7; }
        .btn-delete { color: #f87171; border: 1px solid #ef4444; padding: 4px 10px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; transition: all 0.2s ease; }
        .btn-delete:hover { background-color: #ef4444; color: #ffffff; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <!-- Header -->
        <div class="text-center mb-5">
            <h1 class="fw-bold text-info"><i class="fa-solid fa-leaf text-success me-2"></i>Spring Boot User Portal</h1>
            <p class="text-secondary">High-Performance User Management with in-memory <span class="badge badge-h2">H2 Database</span></p>
        </div>

        <div class="row g-4">
            <!-- Add User Card -->
            <div class="col-lg-5">
                <div class="card shadow-sm p-4">
                    <h4 class="card-title text-white mb-4"><i class="fa-solid fa-user-plus text-info me-2"></i>Register New User</h4>
                    <form th:action="@{/add}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label text-light">Username / Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Shakil Ahamed" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-light">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="e.g. shakil@example.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="fa-solid fa-save me-2"></i>Save to Database
                        </button>
                    </form>
                </div>
            </div>

            <!-- Registered Users Table -->
            <div class="col-lg-7">
                <div class="card shadow-sm p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="card-title text-white mb-0"><i class="fa-solid fa-users text-info me-2"></i>Registered Users</h4>
                        <span class="badge bg-secondary" th:text="${#lists.size(users) + ' Users'}">0 Users</span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-dark table-hover align-middle">
                            <thead>
                                <tr class="text-secondary">
                                    <th style="width: 70px;">ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th style="width: 110px;" class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${users}">
                                    <td class="text-info fw-bold" th:text="${'#' + u.id}">#1</td>
                                    <td th:text="${u.name}">John Doe</td>
                                    <td class="text-secondary" th:text="${u.email}">john@example.com</td>
                                    <td class="text-end">
                                        <a th:href="@{/delete/{id}(id=${u.id})}" 
                                           class="btn-delete"
                                           onclick="return confirm('Are you sure you want to delete this user?');">
                                            <i class="fa-solid fa-trash-can me-1"></i>Delete
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(users)}">
                                    <td colspan="4" class="text-center text-muted py-4">No users registered yet. Add one on the left!</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
